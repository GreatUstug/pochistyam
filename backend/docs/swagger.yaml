basePath: /
definitions:
  auth.AuthRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  auth.AuthResponse:
    properties:
      name:
        type: string
      token:
        type: string
      userId:
        type: string
    type: object
  auth.RegisterRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
    type: object
  rooms.CreateRoomRequest:
    properties:
      height:
        type: integer
      name:
        type: string
      width:
        type: integer
    type: object
  rooms.RoomResponse:
    properties:
      dirtiness:
        type: number
      height:
        type: integer
      id:
        type: string
      name:
        type: string
      needsCleaning:
        type: boolean
      width:
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: Менеджер уборки по комнатам
  title: Pochistyam API
  version: "1.0"
paths:
  /auth:
    post:
      consumes:
      - application/json
      description: Аутентифицирует существующего пользователя
      parameters:
      - description: Данные комнаты
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.AuthRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/auth.AuthResponse'
        "500":
          description: StatusInternalServerError
          schema:
            type: string
      summary: Аутентификация пользователя
      tags:
      - auth
  /createRoom:
    post:
      consumes:
      - application/json
      description: Создает комнату для текущего пользователя
      parameters:
      - description: Данные комнаты
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/rooms.CreateRoomRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/rooms.RoomResponse'
        "401":
          description: Unauthorized
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Создать комнату
      tags:
      - rooms
  /register:
    post:
      consumes:
      - application/json
      description: Регистрирует нового пользователя
      parameters:
      - description: Данные комнаты
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/auth.AuthResponse'
        "500":
          description: StatusInternalServerError
          schema:
            type: string
      summary: Регистрация пользователя
      tags:
      - auth
  /rooms:
    get:
      consumes:
      - application/json
      description: Демонстрация всех комнат пользователя
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/rooms.RoomResponse'
            type: array
        "500":
          description: InternalServerError
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Демонстрация всех комнат пользователя
      tags:
      - rooms
securityDefinitions:
  BearerAuth:
    description: Введите "Bearer <токен>"
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
